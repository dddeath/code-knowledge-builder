interface:
  display_name: "Code Knowledge Builder"
  short_description: "Build Chinese human docs plus a complete deterministic Agent database"
  default_prompt: "Use $code-knowledge-builder to build or query separate source-audited knowledge layers. ALL descriptive prose in entity reviews, appendices, human pages, Wiki, Agent packs, analyses, change reasons, pitfalls, experiments, and session summaries MUST be Simplified Chinese; English is permitted only for proper nouns, API/type/function/variable names, commands, paths, and necessary technical terms. English-only narrative fails the review and completion gates. Initialization creates a fixed detached source snapshot; after snapshot-ready, start one workspace session and allow code edits in the live worktree while the baseline build uses the snapshot. Use machine/knowledge.sqlite through retrieve --profile fast first, precise for harder queries, then entity/neighbors/source/changes; open only the bounded pack and perform narrow source reading only for needs-source-read. Before replying with substantive analysis, record a Chinese analysis note linked to the pack. Finish changed sessions with Chinese headings 修改内容, 修改原因, 验证结果; record independent pitfalls and experiments. For automatic conversation or modification updates, read references/automation.md, explicitly register each repository/Harness, render and inspect the matching Codex/Claude/OpenCode/DSH/generic adapter, and keep raw events in the redacted machine queue. A Hook Stop creates pending-agent-review only; promote it after Chinese evidence_note and exact changed-path source_checks. facts/ is authoritative rebuild data, machine/ is the complete Agent database, human/ is the conservative Chinese Markdown/Obsidian vault, and markdown/ is its compatibility mirror. Human pages use one deterministic type tag, clickable source links, no frontmatter or hash-like identifiers. For a build, require repository, output, explicit markdown|logseq-db|both format, and optional scope; offer --init-git only after user choice. Finalize only after snapshot, every Agent review, Simplified-Chinese audit, facts/machine/human, Graphify, Obsidian, compatibility index, and requested-format gates pass. Retrieval in this release is deterministic SQLite FTS plus fixed graph scoring; do not use vector models until a later benchmark."
policy:
  allow_implicit_invocation: true
